# Nginx configuration for the React frontend container
# Serves the React SPA as static files.
# PORT_PLACEHOLDER will be replaced at container startup

server {
    listen PORT_PLACEHOLDER;
    server_name _;

    # Clinical routes and reset links can carry patient identifiers or secrets.
    # Nginx request/error logs include raw URLs and referrers, so this origin
    # uses health probes rather than request-context logs. Main Nginx startup
    # diagnostics remain available through the image's global error logger.
    access_log off;
    error_log /dev/null crit;

    # Security headers
    include /etc/nginx/hms-security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_disable "MSIE [1-6]\.";

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        include /etc/nginx/hms-security-headers.conf;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Runtime config must never be cached across deployments.
    location = /runtime-config.js {
        include /etc/nginx/hms-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Content-Type application/javascript always;
        try_files $uri =404;
    }

    # Static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/hms-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;

        # Cache control for index.html
        location = /index.html {
            include /etc/nginx/hms-security-headers.conf;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
