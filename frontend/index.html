<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMS - Hospital Management System</title>
    <meta name="description" content="Workflow-oriented hospital management system for clinical staff" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Google Fonts: Fraunces (display), DM Sans (headings), IBM Plex Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <!--
      Boot loader:
      Lighthouse can report NO_FCP if JS fails before React mounts (blank page).
      Keep this minimal and non-PHI; React will replace it on hydrate/mount.
    -->
    <div id="root">
      <div class="hms-boot" role="status" aria-live="polite">
        <div class="hms-boot__inner">
          <div class="hms-boot__mark" aria-hidden="true"></div>
          <p class="hms-boot__text">Loading HMS…</p>
        </div>
      </div>
    </div>
    <style>
      .hms-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #0f172a;
        font: 500 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      .hms-boot__inner {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hms-boot__mark {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #d97706;
      }
      .hms-boot__text {
        margin: 0;
        letter-spacing: 0.02em;
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
