<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMS - Hospital Management System</title>
    <meta name="description" content="Workflow-oriented hospital management system for clinical staff" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Self-hosted shell fonts: Cormorant Garamond (display + headings), IBM Plex Mono (data) -->
    <link rel="preload" as="style" href="/assets/hms-fonts-20260522.css" />
    <link rel="preload" as="font" href="/assets/cormorant-garamond-normal-v21-co3bmX5s.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/assets/ibm-plex-mono-normal-400-v20-F63fjptA.woff2" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/hms-fonts-20260522.css" />
  </head>
  <body>
    <!--
      Boot loader:
      Lighthouse can report NO_FCP if JS fails before React mounts (blank page).
      Keep this minimal and non-PHI; React will replace it on hydrate/mount.
    -->
    <div id="root">
      <div class="hms-boot" role="status" aria-live="polite" aria-label="Loading Hospital Management System">
        <div class="hms-boot__inner">
          <svg class="hms-boot__pulse" viewBox="0 0 128 64" aria-hidden="true" focusable="false">
            <polyline
              class="hms-boot__line hms-boot__line--back"
              points="0,45.486 38.514,45.486 44.595,33.324 50.676,45.486 57.771,45.486 62.838,55.622 71.959,9 80.067,63.729 84.122,45.486 97.297,45.486 103.379,40.419 110.473,45.486 150,45.486"
            ></polyline>
            <polyline
              class="hms-boot__line hms-boot__line--front"
              points="0,45.486 38.514,45.486 44.595,33.324 50.676,45.486 57.771,45.486 62.838,55.622 71.959,9 80.067,63.729 84.122,45.486 97.297,45.486 103.379,40.419 110.473,45.486 150,45.486"
            ></polyline>
          </svg>
          <div class="hms-boot__copy">
            <p class="hms-boot__title">Hospital Management System</p>
          </div>
        </div>
      </div>
    </div>
    <style>
      .hms-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 120% at 50% 0%, #fff7e8 0%, #ffffff 45%, #ffffff 100%);
        color: #d97706;
        font: 500 14px/1.4 "Cormorant Garamond", Georgia, serif;
      }
      .hms-boot__inner {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 14px;
        text-align: center;
      }
      .hms-boot__pulse {
        width: 112px;
        height: 56px;
        overflow: visible;
      }
      .hms-boot__line {
        fill: none;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .hms-boot__line--back {
        stroke: currentColor;
        opacity: 0.16;
      }
      .hms-boot__line--front {
        stroke: currentColor;
        stroke-dasharray: 260;
        stroke-dashoffset: 0;
        animation: hms-boot-dash 1.4s linear infinite;
      }
      .hms-boot__title {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #64748b;
      }
      @keyframes hms-boot-dash {
        0% {
          stroke-dashoffset: 260;
          opacity: 1;
        }
        100% {
          stroke-dashoffset: 0;
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hms-boot__line--front {
          animation: none;
          opacity: 0.65;
        }
      }
    </style>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
