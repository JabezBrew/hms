<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMS - Hospital Management System</title>
    <meta name="description" content="Workflow-oriented hospital management system for clinical staff" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Google Fonts: Fraunces (display), DM Sans (headings), IBM Plex Mono (data) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <!--
      Boot loader:
      Lighthouse can report NO_FCP if JS fails before React mounts (blank page).
      Keep this minimal and non-PHI; React will replace it on hydrate/mount.
    -->
    <div id="root">
      <div class="hms-boot" role="status" aria-live="polite">
        <div class="hms-boot__inner">
          <div class="hms-boot__badge" aria-hidden="true">
            <span class="hms-boot__pulse"></span>
            <span class="hms-boot__cross hms-boot__cross--h"></span>
            <span class="hms-boot__cross hms-boot__cross--v"></span>
          </div>
          <div class="hms-boot__copy">
            <p class="hms-boot__title">Hospital Management System</p>
            <p class="hms-boot__text">Loading HMS...</p>
          </div>
        </div>
      </div>
    </div>
    <style>
      .hms-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 120% at 50% 0%, #fff7e8 0%, #ffffff 45%, #ffffff 100%);
        color: #0f172a;
        font: 500 14px/1.4 "DM Sans", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }
      .hms-boot__inner {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid #f1f5f9;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
      }
      .hms-boot__badge {
        position: relative;
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: linear-gradient(180deg, #f59e0b, #d97706);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 0 0 1px rgba(180, 83, 9, 0.2);
      }
      .hms-boot__pulse {
        position: absolute;
        inset: -4px;
        border-radius: inherit;
        border: 1px solid rgba(217, 119, 6, 0.35);
        animation: hms-boot-pulse 1.8s ease-out infinite;
      }
      .hms-boot__cross {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border-radius: 999px;
        background: #ffffff;
      }
      .hms-boot__cross--h {
        width: 12px;
        height: 2px;
      }
      .hms-boot__cross--v {
        width: 2px;
        height: 12px;
      }
      .hms-boot__copy {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .hms-boot__title {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #64748b;
      }
      .hms-boot__text {
        margin: 0;
        letter-spacing: 0.02em;
      }
      @keyframes hms-boot-pulse {
        0% {
          transform: scale(0.92);
          opacity: 0.85;
        }
        70% {
          transform: scale(1.2);
          opacity: 0;
        }
        100% {
          transform: scale(1.2);
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hms-boot__pulse {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
