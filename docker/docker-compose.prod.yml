# Docker Compose for HMS Production
#
# Production configuration with:
# - External database (managed PostgreSQL like AWS RDS)
# - External Redis (managed like ElastiCache)
# - Scaled services with resource limits
# - Environment variables from .env.prod
#
# Usage:
#   docker-compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d
#   docker-compose -f docker/docker-compose.prod.yml --env-file .env.prod scale api=3

version: '3.8'

services:
  # ===================
  # Backend API (scalable)
  # ===================

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: ${DOCKER_REGISTRY:-}hms-backend:${VERSION:-latest}
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_REPLICA_HOST=${DB_REPLICA_HOST:-}
      - DB_REPLICA_USER=${DB_REPLICA_USER:-}
      - DB_REPLICA_PASSWORD=${DB_REPLICA_PASSWORD:-}
      - REDIS_URL=${REDIS_URL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_HEALTHCARE_DATASET=${GOOGLE_HEALTHCARE_DATASET}
      - GOOGLE_FHIR_STORE=${GOOGLE_FHIR_STORE}
      - GOOGLE_DICOM_STORE=${GOOGLE_DICOM_STORE}
      - GOOGLE_HL7V2_STORE=${GOOGLE_HL7V2_STORE}
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================
  # WebSocket Server (scalable)
  # ===================

  websocket:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daphne
    image: ${DOCKER_REGISTRY:-}hms-websocket:${VERSION:-latest}
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=${REDIS_URL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_HEALTHCARE_DATASET=${GOOGLE_HEALTHCARE_DATASET}
      - GOOGLE_FHIR_STORE=${GOOGLE_FHIR_STORE}
      - GOOGLE_DICOM_STORE=${GOOGLE_DICOM_STORE}
      - GOOGLE_HL7V2_STORE=${GOOGLE_HL7V2_STORE}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - hms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================
  # Celery Workers (scalable)
  # ===================

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    image: ${DOCKER_REGISTRY:-}hms-celery:${VERSION:-latest}
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=${REDIS_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_HEALTHCARE_DATASET=${GOOGLE_HEALTHCARE_DATASET}
      - GOOGLE_FHIR_STORE=${GOOGLE_FHIR_STORE}
      - GOOGLE_DICOM_STORE=${GOOGLE_DICOM_STORE}
      - GOOGLE_HL7V2_STORE=${GOOGLE_HL7V2_STORE}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - hms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================
  # Celery Beat (single instance)
  # ===================

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    image: ${DOCKER_REGISTRY:-}hms-celery:${VERSION:-latest}
    command: ["celery", "-A", "hms_backend", "beat", "--loglevel=info"]
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=${REDIS_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_HEALTHCARE_DATASET=${GOOGLE_HEALTHCARE_DATASET}
      - GOOGLE_FHIR_STORE=${GOOGLE_FHIR_STORE}
      - GOOGLE_DICOM_STORE=${GOOGLE_DICOM_STORE}
      - GOOGLE_HL7V2_STORE=${GOOGLE_HL7V2_STORE}
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - hms-network

  # ===================
  # Frontend (scalable)
  # ===================

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_WS_URL=${VITE_WS_URL}
    image: ${DOCKER_REGISTRY:-}hms-frontend:${VERSION:-latest}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    networks:
      - hms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================
  # Load Balancer (nginx)
  # ===================

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - websocket
      - frontend
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
      restart_policy:
        condition: on-failure
    networks:
      - hms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ===================
# Networks
# ===================

networks:
  hms-network:
    driver: bridge
