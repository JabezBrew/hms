# Legacy Django Docker Compose for HMS Development
#
# Active Rust V2 backend development uses backend-rs/ plus the root dependency
# compose.yml for Postgres/Redis. Keep this full-container stack only for
# explicit legacy Django maintenance/reference work.
#
# Starts all services needed for legacy full-container local development:
# - PostgreSQL (primary + replica)
# - Redis (cache + channels)
# - Django API (gunicorn)
# - Django WebSocket (daphne)
# - Celery worker
# - Celery beat scheduler
# - React frontend (nginx)
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs -f api
#   docker compose -f docker/docker-compose.yml down
#
# For the usual host-based backend/frontend workflow, prefer the root
# compose.yml dependency stack:
#   docker compose up -d postgres redis

services:
  # ===================
  # Database Services
  # ===================

  db:
    image: postgres:15-alpine
    container_name: hms-db
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "wal_keep_size=1GB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/primary/init-primary.sh:/docker-entrypoint-initdb.d/02-init-replication.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  db-replica:
    image: postgres:15-alpine
    container_name: hms-db-replica
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PRIMARY_HOST: db
      PGDATA: /var/lib/postgresql/data
    entrypoint: ["/bin/bash", "/setup-replica.sh"]
    command:
      - "postgres"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "hot_standby_feedback=on"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./postgres/replica/setup-replica.sh:/setup-replica.sh:ro
    ports:
      - "5433:5432"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  # ===================
  # Cache & Message Queue
  # ===================

  redis:
    image: redis:7-alpine
    container_name: hms-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  # ===================
  # Backend Services
  # ===================

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: hms-api
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - DB_NAME=hms
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_REPLICA_HOST=db-replica
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,api
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
      - CSRF_TRUSTED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
      # Add other required env vars here
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-dummy}
      - DEFAULT_FROM_EMAIL=noreply@example.com
      - GOOGLE_APPLICATION_CREDENTIALS=/dev/null
      - GOOGLE_CLOUD_PROJECT=dummy
      - GOOGLE_HEALTHCARE_DATASET=dummy
      - GOOGLE_FHIR_STORE=dummy
      - GOOGLE_DICOM_STORE=dummy
      - GOOGLE_HL7V2_STORE=dummy
    volumes:
      - ../backend:/app:cached
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  websocket:
    build:
      context: ..
      dockerfile: docker/Dockerfile.daphne
    container_name: hms-websocket
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - DB_NAME=hms
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=localhost,127.0.0.1,websocket
      # Add other required env vars
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-dummy}
      - DEFAULT_FROM_EMAIL=noreply@example.com
      - GOOGLE_APPLICATION_CREDENTIALS=/dev/null
      - GOOGLE_CLOUD_PROJECT=dummy
      - GOOGLE_HEALTHCARE_DATASET=dummy
      - GOOGLE_FHIR_STORE=dummy
      - GOOGLE_DICOM_STORE=dummy
      - GOOGLE_HL7V2_STORE=dummy
    volumes:
      - ../backend:/app:cached
    ports:
      - "8001:8001"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hms-network

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: hms-celery
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - DB_NAME=hms
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      # Add other required env vars
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-dummy}
      - DEFAULT_FROM_EMAIL=noreply@example.com
      - GOOGLE_APPLICATION_CREDENTIALS=/dev/null
      - GOOGLE_CLOUD_PROJECT=dummy
      - GOOGLE_HEALTHCARE_DATASET=dummy
      - GOOGLE_FHIR_STORE=dummy
      - GOOGLE_DICOM_STORE=dummy
      - GOOGLE_HL7V2_STORE=dummy
    volumes:
      - ../backend:/app:cached
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hms-network

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.celery
    container_name: hms-celery-beat
    command: ["celery", "-A", "hms_backend", "beat", "--loglevel=info"]
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - DB_NAME=hms
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      # Add other required env vars
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-dummy}
      - DEFAULT_FROM_EMAIL=noreply@example.com
      - GOOGLE_APPLICATION_CREDENTIALS=/dev/null
      - GOOGLE_CLOUD_PROJECT=dummy
      - GOOGLE_HEALTHCARE_DATASET=dummy
      - GOOGLE_FHIR_STORE=dummy
      - GOOGLE_DICOM_STORE=dummy
      - GOOGLE_HL7V2_STORE=dummy
    volumes:
      - ../backend:/app:cached
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hms-network

  # ===================
  # Frontend Service
  # ===================

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8000/api
        - VITE_WS_URL=ws://localhost:8001
    container_name: hms-frontend
    ports:
      - "80:80"
    depends_on:
      - api
      - websocket
    networks:
      - hms-network

# ===================
# Networks
# ===================

networks:
  hms-network:
    driver: bridge

# ===================
# Volumes
# ===================

volumes:
  postgres_data:
  postgres_replica_data:
  redis_data:
  static_volume:
  media_volume:
