# PostgreSQL Primary Server Configuration for Replication
# These settings are appended to the default postgresql.conf

# Replication settings
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB
hot_standby = on

# Synchronous replication (optional - set to 'on' for sync, 'off' for async)
# For load testing, async is usually fine
synchronous_commit = off

# Connection settings
listen_addresses = '*'
max_connections = 200

# Performance settings for load testing
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 128MB

# Logging
log_replication_commands = on
