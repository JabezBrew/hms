# Legacy Django client VPS Compose profile.
#
# Active Rust V2 deployments use ops/compose-v2/compose.yml. Keep this file only
# for explicit legacy Django deployment maintenance/reference.

name: ${COMPOSE_PROJECT_NAME:-hms-client-vps}

x-backend-image: &backend-image
  image: hms-backend-${CLIENT_SLUG:-client}:${VERSION:-latest}
  environment: &backend-environment
    DEBUG: "False"
    PORT: "8000"
    PROCESS_ROLE: backend
    CLIENT_SLUG: ${CLIENT_SLUG:?set CLIENT_SLUG in ops/hetzner-client-vps/.env}
    CLIENT_NAME: ${CLIENT_NAME:?set CLIENT_NAME in ops/hetzner-client-vps/.env}
    CLIENT_DOMAIN: ${CLIENT_DOMAIN:?set CLIENT_DOMAIN in ops/hetzner-client-vps/.env}
    DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:?set DEPLOYMENT_MODE in ops/hetzner-client-vps/.env}
    DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:?set DEPLOYMENT_PROFILE in ops/hetzner-client-vps/.env}
    FEATURE_FLAG_OVERRIDES: ${FEATURE_FLAG_OVERRIDES:-}
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in ops/hetzner-client-vps/.env}
    DB_NAME: ${DB_NAME:-hms}
    DB_USER: ${DB_USER:-hms}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in ops/hetzner-client-vps/.env}
    DB_HOST: ${APP_DB_HOST:-pgbouncer}
    DB_PORT: ${APP_DB_PORT:-6432}
    DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
    DB_DISABLE_SERVER_SIDE_CURSORS: ${DB_DISABLE_SERVER_SIDE_CURSORS:-True}
    ASGI_THREADS: ${ASGI_THREADS:-12}
    REDIS_URL: redis://redis:6379/0
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS in ops/hetzner-client-vps/.env}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in ops/hetzner-client-vps/.env}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS in ops/hetzner-client-vps/.env}
    FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in ops/hetzner-client-vps/.env}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in ops/hetzner-client-vps/.env}
    DEFAULT_FACILITY_CODE: ${DEFAULT_FACILITY_CODE:?set DEFAULT_FACILITY_CODE in ops/hetzner-client-vps/.env}
    DEFAULT_FACILITY_NAME: ${DEFAULT_FACILITY_NAME:?set DEFAULT_FACILITY_NAME in ops/hetzner-client-vps/.env}
    DEFAULT_FACILITY_TYPE: ${DEFAULT_FACILITY_TYPE:?set DEFAULT_FACILITY_TYPE in ops/hetzner-client-vps/.env}
    DEFAULT_FACILITY_ADDRESS: ${DEFAULT_FACILITY_ADDRESS:-}
    DEFAULT_FACILITY_CITY: ${DEFAULT_FACILITY_CITY:-}
    DEFAULT_FACILITY_REGION: ${DEFAULT_FACILITY_REGION:-}
    DEFAULT_FACILITY_COUNTRY: ${DEFAULT_FACILITY_COUNTRY:-}
    DEFAULT_FACILITY_PHONE: ${DEFAULT_FACILITY_PHONE:-}
    DEFAULT_FACILITY_EMAIL: ${DEFAULT_FACILITY_EMAIL:-}
    ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in ops/hetzner-client-vps/.env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in ops/hetzner-client-vps/.env}
    ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Client}
    ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
    MIGRATE_ON_STARTUP: "False"
    FAIL_ON_PENDING_MIGRATIONS: "True"
    AI_ENABLED: ${AI_ENABLED:-False}
    CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
    CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
    CELERY_OPERABILITY_REFRESH_INTERVAL_SECONDS: ${CELERY_OPERABILITY_REFRESH_INTERVAL_SECONDS:-60}
    CELERY_OPERABILITY_INSPECT_TIMEOUT_SECONDS: ${CELERY_OPERABILITY_INSPECT_TIMEOUT_SECONDS:-0.5}
    CELERY_OPERABILITY_REDIS_TIMEOUT_SECONDS: ${CELERY_OPERABILITY_REDIS_TIMEOUT_SECONDS:-0.25}
    ADMIN_DASHBOARD_PREWARM_INTERVAL_SECONDS: ${ADMIN_DASHBOARD_PREWARM_INTERVAL_SECONDS:-0}
    MULTI_FACILITY_MODE: ${MULTI_FACILITY_MODE:-false}
    HMS_RUM_ENABLED: ${HMS_RUM_ENABLED:-False}
    HMS_OTEL_TRACING_ENABLED: ${HMS_OTEL_TRACING_ENABLED:-False}
    OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-hms-api}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
    OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    LOG_AS_JSON: "True"
    FILE_LOGGING_ENABLED: "False"
    DJANGO_DB_LOG_LEVEL: WARNING
    TRUST_PROXY_HEADERS: "True"
    SECURE_SSL_REDIRECT: "True"
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-3600}
    SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}
    SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-False}
    SESSION_COOKIE_SECURE: "True"
    CSRF_COOKIE_SECURE: "True"
    JWT_AUTH_SECURE: "True"
    JWT_AUTH_SAMESITE: Lax
    WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?set WEBAUTHN_RP_ID in ops/hetzner-client-vps/.env}
    WEBAUTHN_ALLOWED_ORIGINS: ${WEBAUTHN_ALLOWED_ORIGINS:?set WEBAUTHN_ALLOWED_ORIGINS in ops/hetzner-client-vps/.env}
    MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?set MFA_ENCRYPTION_KEY in ops/hetzner-client-vps/.env}
    RECORD_EXPORT_FERNET_KEY: ${RECORD_EXPORT_FERNET_KEY:?set RECORD_EXPORT_FERNET_KEY in ops/hetzner-client-vps/.env}
    SESSION_HASH_SALT: ${SESSION_HASH_SALT:?set SESSION_HASH_SALT in ops/hetzner-client-vps/.env}
    MFA_TOTP_ISSUER: ${MFA_TOTP_ISSUER:-HMS}
    EMAIL_PROVIDER: ${EMAIL_PROVIDER:-unosend}
    UNOSEND_API_KEY: ${UNOSEND_API_KEY:-}
    UNOSEND_API_BASE_URL: ${UNOSEND_API_BASE_URL:-https://api.unosend.co}
    UNOSEND_REQUEST_TIMEOUT_SECONDS: ${UNOSEND_REQUEST_TIMEOUT_SECONDS:-10}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    RESEND_API_BASE_URL: ${RESEND_API_BASE_URL:-https://api.resend.com}
    RESEND_REQUEST_TIMEOUT_SECONDS: ${RESEND_REQUEST_TIMEOUT_SECONDS:-10}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?set DEFAULT_FROM_EMAIL in ops/hetzner-client-vps/.env}
    EMAIL_SENDER_DOMAIN: ${EMAIL_SENDER_DOMAIN:-}
    EMAIL_WELCOME_LOCAL_PART: ${EMAIL_WELCOME_LOCAL_PART:-welcome}
    EMAIL_SECURITY_LOCAL_PART: ${EMAIL_SECURITY_LOCAL_PART:-security}
    WELCOME_FROM_EMAIL: ${WELCOME_FROM_EMAIL:-}
    SECURITY_FROM_EMAIL: ${SECURITY_FROM_EMAIL:-}
    GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}
    GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-client-disabled}
    GOOGLE_HEALTHCARE_DATASET: ${GOOGLE_HEALTHCARE_DATASET:-client-disabled}
    GOOGLE_FHIR_STORE: ${GOOGLE_FHIR_STORE:-client-disabled}
    GOOGLE_DICOM_STORE: ${GOOGLE_DICOM_STORE:-client-disabled}
    GOOGLE_HL7V2_STORE: ${GOOGLE_HL7V2_STORE:-client-disabled}
  depends_on:
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - internal
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    environment:
      CLIENT_DOMAIN: ${CLIENT_DOMAIN:?set CLIENT_DOMAIN in ops/hetzner-client-vps/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in ops/hetzner-client-vps/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: hms-frontend-${CLIENT_SLUG:-client}:${VERSION:-latest}
    environment:
      API_BASE_URL: /api
      WS_URL: ${FRONTEND_WS_URL:-}
      DEFAULT_FACILITY_CODE: ${DEFAULT_FACILITY_CODE:?set DEFAULT_FACILITY_CODE in ops/hetzner-client-vps/.env}
      MULTI_FACILITY_MODE: ${MULTI_FACILITY_MODE:-false}
      RUM_ENABLED: ${HMS_RUM_ENABLED:-False}
    expose:
      - "80"
    networks:
      - edge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    <<: *backend-image
    build:
      context: ../../backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    networks:
      edge:
        aliases:
          - hms-api
      internal:
        aliases:
          - hms-api
      egress: {}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Host: ${CLIENT_DOMAIN}' http://127.0.0.1:8000/api/health/ready/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1200m
    cpus: 1.25

  worker:
    <<: *backend-image
    environment:
      <<: *backend-environment
      PROCESS_ROLE: worker
      PORT: "8000"
    networks:
      - internal
      - egress
    mem_limit: 700m
    cpus: 0.75

  beat:
    <<: *backend-image
    environment:
      <<: *backend-environment
      PROCESS_ROLE: beat
      PORT: "8000"
    mem_limit: 256m
    cpus: 0.25

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-hms}
      POSTGRES_USER: ${DB_USER:-hms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in ops/hetzner-client-vps/.env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 1200m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  pgbouncer:
    image: bitnamilegacy/pgbouncer:1.24.1-debian-12-r10
    environment:
      POSTGRESQL_HOST: db
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: ${DB_NAME:-hms}
      POSTGRESQL_USERNAME: ${DB_USER:-hms}
      POSTGRESQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in ops/hetzner-client-vps/.env}
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_DATABASE: ${DB_NAME:-hms}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-15}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits
    expose:
      - "6432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRESQL_PASSWORD}\" /opt/bitnami/postgresql/bin/psql -h 127.0.0.1 -p 6432 -U \"$${POSTGRESQL_USERNAME}\" -d \"$${POSTGRESQL_DATABASE}\" -tAc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 128m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1000"
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  edge:
    driver: bridge
  egress:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
