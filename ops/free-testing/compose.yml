# Synthetic solo testing only. Merge after ops/compose-v2/compose.yml.
# Cloudflare provides browser TLS and optional Access; the origin has no public ports.
services:
  caddy:
    environment:
      HMS_TUNNEL_PROXY_IPV4: ${HMS_TUNNEL_PROXY_IPV4:-172.30.242.3}
    ports: !override
      - "127.0.0.1:${HMS_TEST_HTTP_PORT:-8088}:80"
    volumes: !override
      - ../free-testing/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
    networks: !override
      edge: {}
      api_proxy:
        ipv4_address: ${HMS_API_PROXY_CADDY_IPV4:-172.30.241.2}
      tunnel_proxy:
        ipv4_address: ${HMS_TUNNEL_PROXY_CADDY_IPV4:-172.30.242.2}

  hms-api:
    build:
      args:
        CARGO_BUILD_JOBS: "2"
    environment:
      HMS_ENV: staging
      # Caddy's actual API-side peer and the connector hop it appends to XFF.
      HMS_TRUSTED_PROXY_CIDRS: ${HMS_API_PROXY_CADDY_IPV4:-172.30.241.2}/32,${HMS_TUNNEL_PROXY_IPV4:-172.30.242.3}/32
      HMS_ACCOUNT_SETUP_DELIVERY_MODE: disabled
      HMS_PUBLIC_APP_URL: https://${CLIENT_DOMAIN:?set CLIENT_DOMAIN}
      HMS_WEBAUTHN_RP_ID: ${CLIENT_DOMAIN:?set CLIENT_DOMAIN}
      HMS_WEBAUTHN_RP_ORIGIN: https://${CLIENT_DOMAIN:?set CLIENT_DOMAIN}
    networks: !override
      api_proxy:
        aliases: [hms-api]
        ipv4_address: ${HMS_API_PROXY_API_IPV4:-172.30.241.3}
      internal:
        aliases: [hms-api]

  hms-worker:
    environment:
      HMS_ENV: staging

  hms-migrator:
    environment:
      HMS_ENV: staging
      HMS_SEED_DEMO_DATA: "true"
      HMS_DEMO_SEED_PROFILE: smoke

  # Disable SQL text and bind-parameter logging. Aggregate pg_stat_statements
  # remains available inside the private database network.
  db:
    command: !override
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=60
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0

  prometheus:
    profiles: [monitoring-disabled]

  grafana:
    profiles: [monitoring-disabled]

  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      caddy:
        condition: service_healthy
    networks: !override
      tunnel_proxy:
        ipv4_address: ${HMS_TUNNEL_PROXY_IPV4:-172.30.242.3}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# Keep the connector and API on separate links. Trust neither the shared frontend
# network nor an entire RFC1918 range. Choose non-overlapping subnets per host.
networks:
  api_proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${HMS_API_PROXY_SUBNET:-172.30.241.0/29}
  tunnel_proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${HMS_TUNNEL_PROXY_SUBNET:-172.30.242.0/29}
