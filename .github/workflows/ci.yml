name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

env:
  RUST_TOOLCHAIN: stable
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # Active Rust Backend Tests
  # ==========================================================================
  rust-backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL client tools
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Set up Rust
      run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt

    - name: Run Rust backend checks
      env:
        PGPASSWORD: postgres
        HMS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hms
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend-rs
        cargo +${{ env.RUST_TOOLCHAIN }} fmt --all --check
        cargo +${{ env.RUST_TOOLCHAIN }} test --workspace

  # ==========================================================================
  # Frontend Tests
  # ==========================================================================
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint
      run: |
        cd frontend
        npm run lint

    - name: Verify generated Rust V2 API client
      run: |
        cd frontend
        npm run api:v2:generate:check

    - name: Run unit tests with coverage
      run: |
        cd frontend
        npm run test:coverage

    - name: Build frontend for perf audit
      run: |
        cd frontend
        npm run build

    - name: Enforce bundle budgets
      run: |
        cd frontend
        npm run perf:bundle-budget

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: frontend/coverage/
        retention-days: 30

  # ==========================================================================
  # Docker Build Validation
  # ==========================================================================
  docker-builds:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Rust backend image
      run: |
        docker build \
          --file backend-rs/Dockerfile \
          --tag hms-rust-backend:ci-${{ github.sha }} \
          backend-rs

    - name: Build frontend image
      run: |
        docker build \
          --file frontend/Dockerfile \
          --build-arg VITE_HMS_API_MODE=rust-v2 \
          --build-arg VITE_V2_API_BASE_URL=/api/v2 \
          --build-arg VITE_API_BASE_URL=https://example.invalid/api \
          --build-arg VITE_WS_URL=wss://example.invalid \
          --tag hms-frontend:ci-${{ github.sha }} \
          frontend

  # ==========================================================================
  # Build and Deploy (only on main branch push)
  # ==========================================================================
  build-and-deploy:
    needs: [rust-backend-tests, frontend-tests, docker-builds]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build Rust backend
      run: |
        cd backend-rs
        cargo +${{ env.RUST_TOOLCHAIN }} build --release --workspace --bins

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Deploy
      run: |
        echo "Deployment would happen here"

    - name: Upload frontend build artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
        retention-days: 30
