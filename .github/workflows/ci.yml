name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # Backend Tests
  # ==========================================================================
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Migration preflight checks
      env:
        DEBUG: True
        SECRET_KEY: test-secret-key-ci-${{ github.run_id }}
        DB_NAME: hms_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        SENDGRID_API_KEY: test-sendgrid-key
        DEFAULT_FROM_EMAIL: ci@example.com
        GOOGLE_APPLICATION_CREDENTIALS: ""
        GOOGLE_CLOUD_PROJECT: test-project
        GOOGLE_HEALTHCARE_DATASET: test-dataset
        GOOGLE_FHIR_STORE: test-fhir-store
        GOOGLE_DICOM_STORE: test-dicom-store
        GOOGLE_HL7V2_STORE: test-hl7v2-store
      run: |
        cd backend
        python manage.py preflight_migration_checks --strict

    - name: Startup gate smoke
      env:
        DEBUG: True
        SECRET_KEY: test-secret-key-ci-${{ github.run_id }}
        DB_NAME: hms_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        SENDGRID_API_KEY: test-sendgrid-key
        DEFAULT_FROM_EMAIL: ci@example.com
        GOOGLE_APPLICATION_CREDENTIALS: ""
        GOOGLE_CLOUD_PROJECT: test-project
        GOOGLE_HEALTHCARE_DATASET: test-dataset
        GOOGLE_FHIR_STORE: test-fhir-store
        GOOGLE_DICOM_STORE: test-dicom-store
        GOOGLE_HL7V2_STORE: test-hl7v2-store
      run: |
        cd backend
        python manage.py migrate --noinput
        python manage.py check_pending_migrations --fail-on-pending
        python startup.py

    - name: Run tests with coverage
      env:
        DEBUG: True
        SECRET_KEY: test-secret-key-ci-${{ github.run_id }}
        DB_NAME: hms_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        SENDGRID_API_KEY: test-sendgrid-key
        DEFAULT_FROM_EMAIL: ci@example.com
        GOOGLE_APPLICATION_CREDENTIALS: ""
        GOOGLE_CLOUD_PROJECT: test-project
        GOOGLE_HEALTHCARE_DATASET: test-dataset
        GOOGLE_FHIR_STORE: test-fhir-store
        GOOGLE_DICOM_STORE: test-dicom-store
        GOOGLE_HL7V2_STORE: test-hl7v2-store
      run: |
        cd backend
        pytest --cov=apps --cov-report=xml --cov-report=html --cov-report=term-missing -v

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage-report
        path: backend/coverage_html/
        retention-days: 30

  # ==========================================================================
  # Frontend Tests
  # ==========================================================================
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint
      run: |
        cd frontend
        npm run lint

    - name: Run unit tests with coverage
      run: |
        cd frontend
        npm run test:coverage

    - name: Build frontend for perf audit
      run: |
        cd frontend
        npm run build

    - name: Enforce bundle budgets
      run: |
        cd frontend
        npm run perf:bundle-budget

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: frontend/coverage/
        retention-days: 30

  # ==========================================================================
  # Frontend E2E Smoke
  # ==========================================================================
  frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: True
      SECRET_KEY: e2e-secret-key-${{ github.run_id }}
      DJANGO_SETTINGS_MODULE: hms_backend.settings_test
      DB_NAME: hms_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      SENDGRID_API_KEY: test-sendgrid-key
      DEFAULT_FROM_EMAIL: e2e@example.com
      DEFAULT_FACILITY_CODE: MAIN
      MULTI_FACILITY_MODE: false
      MFA_REQUIRED_FOR_ALL: false
      MFA_REQUIRED_FOR_ADMIN: false
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_CLOUD_PROJECT: test-project
      GOOGLE_HEALTHCARE_DATASET: test-dataset
      GOOGLE_FHIR_STORE: test-fhir-store
      GOOGLE_DICOM_STORE: test-dicom-store
      GOOGLE_HL7V2_STORE: test-hl7v2-store
      E2E_ADMIN_EMAIL: admin@hms.com
      E2E_ADMIN_PASSWORD: Admin123!
      E2E_SMOKE_PATIENT_NAME: Smoke Patient
      VITE_API_BASE_URL: http://127.0.0.1:8000/api
      VITE_WS_URL: ws://127.0.0.1:8001
      VITE_DEFAULT_FACILITY_CODE: MAIN
      VITE_MULTI_FACILITY_MODE: false
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        npx playwright install --with-deps chromium

    - name: Prepare smoke-test data
      run: |
        cd backend
        python manage.py migrate --noinput
        python manage.py provision_default_facility
        python manage.py ensure_admin --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD"
        python manage.py seed_e2e_smoke

    - name: Start backend and frontend
      run: |
        cd backend
        python manage.py runserver 127.0.0.1:8000 > ../backend-e2e.log 2>&1 &
        echo $! > ../backend-e2e.pid
        cd ../frontend
        npm run build > ../frontend-build-e2e.log 2>&1
        npx vite preview --host 127.0.0.1 --port 4173 > ../frontend-e2e.log 2>&1 &
        echo $! > ../frontend-e2e.pid

    - name: Wait for backend and frontend
      run: |
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8000/api/health/ready/ >/dev/null && curl -fsS http://127.0.0.1:4173/ >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "Backend or frontend failed to start in time" >&2
        exit 1

    - name: Run Playwright smoke tests
      run: |
        cd frontend
        npm run e2e

    - name: Stop background services
      if: always()
      run: |
        if [ -f backend-e2e.pid ]; then kill "$(cat backend-e2e.pid)" || true; fi
        if [ -f frontend-e2e.pid ]; then kill "$(cat frontend-e2e.pid)" || true; fi

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-e2e-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
          backend-e2e.log
          frontend-e2e.log
          frontend-build-e2e.log
        retention-days: 30

  # ==========================================================================
  # Docker Build Validation
  # ==========================================================================
  docker-builds:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      run: |
        docker build \
          --file backend/Dockerfile \
          --tag hms-backend:ci-${{ github.sha }} \
          backend

    - name: Build frontend image
      run: |
        docker build \
          --file frontend/Dockerfile \
          --build-arg VITE_API_BASE_URL=https://example.invalid/api \
          --build-arg VITE_WS_URL=wss://example.invalid \
          --tag hms-frontend:ci-${{ github.sha }} \
          frontend

  # ==========================================================================
  # Build and Deploy (only on main branch push)
  # ==========================================================================
  build-and-deploy:
    needs: [backend-tests, frontend-tests, frontend-e2e, docker-builds]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build backend
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install gunicorn

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    # Add deployment steps here (e.g., to Heroku, AWS, GCP, etc.)
    # This is a placeholder for actual deployment steps
    - name: Deploy
      run: |
        echo "Deployment would happen here"

    - name: Upload frontend build artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
        retention-days: 30
