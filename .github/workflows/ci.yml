name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

env:
  RUST_TOOLCHAIN: stable
  NODE_VERSION: '20'

jobs:
  # ==========================================================================
  # CI Policy
  # ==========================================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      docker: ${{ steps.classify.outputs.docker }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      changed_files: ${{ steps.classify.outputs.changed_files }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Classify changed paths
      id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref }}
        BEFORE_SHA: ${{ github.event.before || '' }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        HEAD_SHA: ${{ github.sha }}
      run: |
        python3 - <<'PY'
        import os
        import subprocess
        import sys

        event_name = os.environ["EVENT_NAME"]
        ref_name = os.environ["REF_NAME"]
        before_sha = os.environ.get("BEFORE_SHA", "")
        base_sha = os.environ.get("BASE_SHA", "")
        head_sha = os.environ.get("HEAD_SHA", "HEAD")

        full_ci = event_name in {"schedule", "workflow_dispatch"}
        compare_base = base_sha if event_name == "pull_request" else before_sha
        if not compare_base or compare_base.startswith("000000"):
            full_ci = True

        changed = []
        if not full_ci:
            try:
                diff = subprocess.check_output(
                    ["git", "diff", "--name-only", compare_base, head_sha],
                    text=True,
                )
                changed = [line.strip() for line in diff.splitlines() if line.strip()]
            except subprocess.CalledProcessError:
                print("Unable to compute changed paths; running full CI.", file=sys.stderr)
                full_ci = True

        def starts_any(path, prefixes):
            return any(path.startswith(prefix) for prefix in prefixes)

        workflow_changed = full_ci or any(
            starts_any(path, (".github/workflows/",)) for path in changed
        )
        contract_changed = any(
            starts_any(path, ("docs/contracts/", "backend-rs/openapi/"))
            or path in {
                "backend-rs/crates/hms-api/src/openapi.rs",
                "frontend/scripts/generate-v2-api-client.mjs",
            }
            for path in changed
        )
        backend_changed = full_ci or workflow_changed or contract_changed or any(
            starts_any(path, ("backend-rs/",)) for path in changed
        )
        frontend_changed = full_ci or workflow_changed or contract_changed or any(
            starts_any(path, ("frontend/",)) for path in changed
        )
        docker_runtime_changed = full_ci or workflow_changed or any(
            starts_any(
                path,
                (
                    "ops/compose-v2/",
                    "ops/gcp-staging/",
                    "ops/hetzner-v2/",
                    "monitoring/",
                ),
            )
            or path
            in {
                "compose.yml",
                "deploy",
                "ops/deploy.sh",
                "ops/create-client-deployment.py",
                "backend-rs/Dockerfile",
                "backend-rs/Cargo.lock",
                "frontend/Dockerfile",
                "frontend/package.json",
                "frontend/package-lock.json",
            }
            for path in changed
        )
        main_push = event_name == "push" and ref_name == "refs/heads/main"
        docker_changed = docker_runtime_changed or (
            main_push and (backend_changed or frontend_changed)
        )
        docs_only = bool(changed) and not workflow_changed and not contract_changed and all(
            starts_any(path, ("docs/",))
            or path.endswith(".md")
            or path in {"AGENTS.md", "CONTEXT.md"}
            for path in changed
        )

        outputs = {
            "backend": backend_changed,
            "frontend": frontend_changed,
            "docker": docker_changed,
            "docs_only": docs_only,
            "changed_files": ",".join(changed) if changed else "full-ci",
        }
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            for name, value in outputs.items():
                if isinstance(value, bool):
                    value = str(value).lower()
                print(f"{name}={value}", file=out)

        for name, value in outputs.items():
            print(f"{name}: {value}")
        PY

  # ==========================================================================
  # Active Rust Backend Tests
  # ==========================================================================
  rust-backend-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install PostgreSQL client tools
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Set up Rust
      run: rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component rustfmt

    - name: Run Rust backend checks
      env:
        PGPASSWORD: postgres
        HMS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hms
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend-rs
        cargo +${{ env.RUST_TOOLCHAIN }} fmt --all --check
        cargo +${{ env.RUST_TOOLCHAIN }} test --workspace

  # ==========================================================================
  # Frontend Tests
  # ==========================================================================
  frontend-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint
      run: |
        cd frontend
        npm run lint

    - name: Verify generated Rust V2 API client
      run: |
        cd frontend
        npm run api:v2:generate:check

    - name: Run unit tests with coverage
      run: |
        cd frontend
        npm run test:coverage

    - name: Build frontend for perf audit
      run: |
        cd frontend
        npm run build

    - name: Enforce bundle budgets
      run: |
        cd frontend
        npm run perf:bundle-budget

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: frontend/coverage/
        retention-days: 30

  # ==========================================================================
  # Docker Build Validation
  # ==========================================================================
  docker-builds:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Rust backend image
      run: |
        docker build \
          --file backend-rs/Dockerfile \
          --tag hms-rust-backend:ci-${{ github.sha }} \
          backend-rs

    - name: Build frontend image
      run: |
        docker build \
          --file frontend/Dockerfile \
          --build-arg VITE_HMS_API_MODE=rust-v2 \
          --build-arg VITE_V2_API_BASE_URL=/api/v2 \
          --build-arg VITE_API_BASE_URL=https://example.invalid/api \
          --build-arg VITE_WS_URL=wss://example.invalid \
          --tag hms-frontend:ci-${{ github.sha }} \
          frontend

  # ==========================================================================
  # Summary
  # ==========================================================================
  ci-summary:
    needs: [changes, rust-backend-tests, frontend-tests, docker-builds]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Report CI policy decisions
      shell: bash
      run: |
        echo "Changed files: ${{ needs.changes.outputs.changed_files }}"
        echo "Run backend checks: ${{ needs.changes.outputs.backend }}"
        echo "Run frontend checks: ${{ needs.changes.outputs.frontend }}"
        echo "Run Docker builds: ${{ needs.changes.outputs.docker }}"
        echo "Docs-only change: ${{ needs.changes.outputs.docs_only }}"

    - name: Fail if a selected job failed
      shell: bash
      run: |
        check_result() {
          local job="$1"
          local result="$2"
          case "$result" in
            success|skipped)
              ;;
            *)
              echo "$job finished with result: $result" >&2
              exit 1
              ;;
          esac
        }

        check_result "changes" "${{ needs.changes.result }}"
        check_result "rust-backend-tests" "${{ needs.rust-backend-tests.result }}"
        check_result "frontend-tests" "${{ needs.frontend-tests.result }}"
        check_result "docker-builds" "${{ needs.docker-builds.result }}"
