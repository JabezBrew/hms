name: Legacy Django Reference Checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  legacy-django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt

    - name: Lint with flake8
      run: |
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Migration preflight checks
      env:
        DEBUG: True
        SECRET_KEY: test-secret-key-ci-${{ github.run_id }}
        DB_NAME: hms_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        EMAIL_PROVIDER: resend
        RESEND_API_KEY: test-resend-key
        UNOSEND_API_KEY: test-unosend-key
        SENDGRID_API_KEY: test-sendgrid-key
        DEFAULT_FROM_EMAIL: ci@example.com
        GOOGLE_APPLICATION_CREDENTIALS: ""
        GOOGLE_CLOUD_PROJECT: test-project
        GOOGLE_HEALTHCARE_DATASET: test-dataset
        GOOGLE_FHIR_STORE: test-fhir-store
        GOOGLE_DICOM_STORE: test-dicom-store
        GOOGLE_HL7V2_STORE: test-hl7v2-store
      run: |
        cd backend
        python manage.py preflight_migration_checks --strict

    - name: Startup gate smoke
      env:
        DEBUG: True
        SECRET_KEY: test-secret-key-ci-${{ github.run_id }}
        DB_NAME: hms_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        EMAIL_PROVIDER: resend
        RESEND_API_KEY: test-resend-key
        UNOSEND_API_KEY: test-unosend-key
        SENDGRID_API_KEY: test-sendgrid-key
        DEFAULT_FROM_EMAIL: ci@example.com
        GOOGLE_APPLICATION_CREDENTIALS: ""
        GOOGLE_CLOUD_PROJECT: test-project
        GOOGLE_HEALTHCARE_DATASET: test-dataset
        GOOGLE_FHIR_STORE: test-fhir-store
        GOOGLE_DICOM_STORE: test-dicom-store
        GOOGLE_HL7V2_STORE: test-hl7v2-store
      run: |
        cd backend
        python manage.py migrate --noinput
        python manage.py check_pending_migrations --fail-on-pending
        python startup.py

    - name: Run backend tests
      env:
        DEBUG: True
        DJANGO_SETTINGS_MODULE: hms_backend.settings_test
        SECRET_KEY: test-secret-key-ci-${{ github.run_id }}
        DB_NAME: hms_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        EMAIL_PROVIDER: resend
        RESEND_API_KEY: test-resend-key
        UNOSEND_API_KEY: test-unosend-key
        SENDGRID_API_KEY: test-sendgrid-key
        DEFAULT_FROM_EMAIL: ci@example.com
        GOOGLE_APPLICATION_CREDENTIALS: ""
        GOOGLE_CLOUD_PROJECT: test-project
        GOOGLE_HEALTHCARE_DATASET: test-dataset
        GOOGLE_FHIR_STORE: test-fhir-store
        GOOGLE_DICOM_STORE: test-dicom-store
        GOOGLE_HL7V2_STORE: test-hl7v2-store
      run: |
        cd backend
        pytest -n auto

  legacy-django-coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt

    - name: Run legacy Django coverage
      env:
        DEBUG: True
        DJANGO_SETTINGS_MODULE: hms_backend.settings_test
        SECRET_KEY: test-secret-key-ci-${{ github.run_id }}
        DB_NAME: hms_test
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_URL: redis://localhost:6379/0
        EMAIL_PROVIDER: resend
        RESEND_API_KEY: test-resend-key
        UNOSEND_API_KEY: test-unosend-key
        SENDGRID_API_KEY: test-sendgrid-key
        DEFAULT_FROM_EMAIL: ci@example.com
        GOOGLE_APPLICATION_CREDENTIALS: ""
        GOOGLE_CLOUD_PROJECT: test-project
        GOOGLE_HEALTHCARE_DATASET: test-dataset
        GOOGLE_FHIR_STORE: test-fhir-store
        GOOGLE_DICOM_STORE: test-dicom-store
        GOOGLE_HL7V2_STORE: test-hl7v2-store
      run: |
        cd backend
        pytest --cov=apps --cov-report=xml --cov-report=html --cov-report=term-missing

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./backend/coverage.xml
        flags: legacy-django
        name: legacy-django-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: legacy-django-coverage-report
        path: backend/coverage_html/
        retention-days: 30

  legacy-django-frontend-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: True
      SECRET_KEY: e2e-secret-key-${{ github.run_id }}
      DJANGO_SETTINGS_MODULE: hms_backend.settings_test
      DB_NAME: hms_e2e
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      EMAIL_PROVIDER: resend
      RESEND_API_KEY: test-resend-key
      UNOSEND_API_KEY: test-unosend-key
      SENDGRID_API_KEY: test-sendgrid-key
      DEFAULT_FROM_EMAIL: e2e@example.com
      DEFAULT_FACILITY_CODE: MAIN
      MULTI_FACILITY_MODE: false
      MFA_REQUIRED_FOR_ALL: false
      MFA_REQUIRED_FOR_ADMIN: false
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_CLOUD_PROJECT: test-project
      GOOGLE_HEALTHCARE_DATASET: test-dataset
      GOOGLE_FHIR_STORE: test-fhir-store
      GOOGLE_DICOM_STORE: test-dicom-store
      GOOGLE_HL7V2_STORE: test-hl7v2-store
      E2E_ADMIN_EMAIL: admin@hms.com
      E2E_SMOKE_PATIENT_NAME: Smoke Patient
      VITE_API_BASE_URL: http://127.0.0.1:8000/api
      VITE_WS_URL: ws://127.0.0.1:8001
      VITE_DEFAULT_FACILITY_CODE: MAIN
      VITE_MULTI_FACILITY_MODE: false
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install legacy Django backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-dev.txt

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        npx playwright install --with-deps chromium

    - name: Generate E2E admin password
      run: |
        password="$(python -c 'import secrets; print("HmsE2E-" + secrets.token_urlsafe(24) + "-Aa1!")')"
        echo "::add-mask::$password"
        echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"

    - name: Prepare legacy Django smoke-test data
      run: |
        cd backend
        python manage.py migrate --noinput
        python manage.py provision_default_facility
        python manage.py ensure_admin --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD"
        python manage.py seed_e2e_smoke

    - name: Start legacy Django backend and frontend
      run: |
        cd backend
        python manage.py runserver 127.0.0.1:8000 > ../backend-e2e.log 2>&1 &
        echo $! > ../backend-e2e.pid
        cd ../frontend
        npm run build > ../frontend-build-e2e.log 2>&1
        npx vite preview --host 127.0.0.1 --port 4173 > ../frontend-e2e.log 2>&1 &
        echo $! > ../frontend-e2e.pid

    - name: Wait for legacy Django backend and frontend
      run: |
        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:8000/api/health/ready/ >/dev/null && curl -fsS http://127.0.0.1:4173/ >/dev/null; then
            exit 0
          fi
          sleep 2
        done
        echo "Backend or frontend failed to start in time" >&2
        exit 1

    - name: Run Playwright smoke tests
      run: |
        cd frontend
        npm run e2e

    - name: Stop background services
      if: always()
      run: |
        if [ -f backend-e2e.pid ]; then kill "$(cat backend-e2e.pid)" || true; fi
        if [ -f frontend-e2e.pid ]; then kill "$(cat frontend-e2e.pid)" || true; fi

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: legacy-django-frontend-e2e-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
          backend-e2e.log
          frontend-e2e.log
          frontend-build-e2e.log
        retention-days: 30

  legacy-django-docker-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build legacy Django backend image
      run: |
        docker build \
          --file backend/Dockerfile \
          --tag hms-legacy-django-backend:ci-${{ github.sha }} \
          backend
