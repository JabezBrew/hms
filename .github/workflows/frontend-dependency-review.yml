name: Frontend Dependency Review

on:
  # Dependency review requires repository support for Dependency Graph/GitHub
  # Advanced Security. Keep this manual until that is enabled for HMS.
  workflow_dispatch:

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
