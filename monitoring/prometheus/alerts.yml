groups:
  - name: hms-readiness
    rules:
      - alert: HMSApiMetricsTargetDown
        expr: up{job="hms-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: HMS API metrics target is unreachable
          what_happened: "Prometheus cannot scrape the HMS API metrics endpoint for this client."
          why_it_matters: "Readiness, dependency, worker, and queue health may be invisible while the target is down."
          likely_cause: "The API container is down, the private metrics proxy is down, the WireGuard route is broken, or /api/metrics/ is not reachable from the monitoring network."
          first_checks: "Check docker compose ps on the client VPS, then curl the private metrics URL from the monitoring host, then inspect api and metrics-proxy logs."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSApiNotReady
        expr: hms_api_health_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: HMS API readiness is failing
          what_happened: "The API process is responding to metrics, but its readiness check reports unhealthy dependencies."
          why_it_matters: "Users may see failed requests or unsafe latency because the API cannot reliably reach required services."
          likely_cause: "Postgres, PgBouncer, Redis, or the API dependency check path is failing."
          first_checks: "Open the readiness endpoint, check hms_api_dependency_ready by dependency in Grafana, then inspect api, pgbouncer, db, and redis logs."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSDependencyDown
        expr: hms_api_dependency_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: HMS required dependency is down
          what_happened: "The API readiness probe reports a required dependency as unavailable."
          why_it_matters: "The API cannot be considered safe to serve clinical workflows while required dependencies are failing."
          likely_cause: "A Postgres/PgBouncer/Redis container is down, overloaded, or unreachable from the API container."
          first_checks: "Use the dependency label to identify the failing service, then check docker health, container logs, memory pressure, and disk availability."
          runbook: "monitoring/README.md#troubleshooting"

  - name: hms-api-experience
    rules:
      - alert: HMSApiHigh5xxRate
        expr: |
          (
            (
              sum by (client, environment) (rate(hms_api_http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum by (client, environment) (rate(hms_api_http_requests_total[5m])), 0.001)
            ) > 0.02
            and
            sum by (client, environment) (rate(hms_api_http_requests_total[5m])) > 0.1
          )
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: HMS API 5xx rate is elevated
          what_happened: "More than 2 percent of API requests have returned 5xx responses for five minutes."
          why_it_matters: "Clinical workflows may be failing even if the process and readiness checks still look healthy."
          likely_cause: "Recent deploy regression, database/cache outage, exhausted worker threads, unhandled exception, or a downstream service failure."
          first_checks: "Open the API request dashboard, split errors by route/status, check Loki for the same route and time window, then inspect the API container logs without pasting PHI into chat."
          runbook: "monitoring/README.md#first-response-workflow"

      - alert: HMSApiHighP95Latency
        expr: |
          (
            histogram_quantile(
              0.95,
              sum by (client, environment, le) (rate(hms_api_http_request_duration_seconds_bucket[5m]))
            ) > 0.75
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HMS API p95 latency is high
          what_happened: "The API p95 request latency has stayed above 750 ms for ten minutes."
          why_it_matters: "Slow clinical views delay bedside work and often arrive before full outages."
          likely_cause: "Slow database query, N+1 regression, PgBouncer saturation, Redis latency, CPU pressure, or a noisy route introduced by a deploy."
          first_checks: "Open the request latency dashboard, identify the slowest route, compare database/container panels for the same window, then check logs for slow request entries."
          runbook: "monitoring/README.md#first-response-workflow"

      - alert: HMSRumIngestionMissing
        expr: |
          (hms_rum_enabled == 1)
          unless on (client, environment)
          (sum by (client, environment) (increase(hms_browser_rum_events_total[15m])) > 0)
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: HMS RUM ingestion is missing
          what_happened: "Frontend RUM is marked enabled, but Prometheus has not seen browser telemetry events for at least 15 minutes."
          why_it_matters: "Frontend load failures, browser-side API errors, and real-user latency may be invisible during an incident."
          likely_cause: "RUM endpoint disabled, frontend env mismatch, collector/API route failing, ad blocker or CSP blocking telemetry, or the staging site has no browser traffic."
          first_checks: "Confirm RUM is intentionally enabled for this environment, generate one staging page load, check the browser network request, then check API logs and the RUM ingestion panel."
          runbook: "monitoring/README.md#validate-staging"

  - name: hms-workers
    rules:
      - alert: HMSWorkerMissing
        expr: up{job="hms-worker"} == 0 or hms_worker_up < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: HMS Rust worker is not visible
          what_happened: "Prometheus cannot see a healthy Rust worker metrics signal."
          why_it_matters: "Background clinical and operational jobs may stop running, including async refreshes and deferred workflows."
          likely_cause: "The worker container is stopped, cannot connect to Postgres, is overloaded, or the private metrics proxy cannot reach it."
          first_checks: "Check worker container health, Redis health, worker logs, and whether queues are growing."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSWorkerDatabaseNotReady
        expr: hms_worker_database_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: HMS worker database readiness is failing
          what_happened: "The Rust worker is visible, but its database readiness check is failing."
          why_it_matters: "Queued jobs may not be processed while the worker cannot reliably reach Postgres."
          likely_cause: "PgBouncer, Postgres, network routing, or worker database credentials are failing."
          first_checks: "Check worker logs, PgBouncer health, Postgres health, and recent deploy or env changes."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSWorkerQueueBacklog
        expr: sum by (client, environment, status) (hms_worker_job_queue_depth{status="queued"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HMS worker queue backlog is elevated
          what_happened: "The Rust worker queued-job backlog has stayed above the threshold for five minutes."
          why_it_matters: "Time-sensitive async work may be delayed even if the API is still responding."
          likely_cause: "The worker is down, database access is failing, job processing is too slow, or a job type is failing/retrying repeatedly."
          first_checks: "Check worker health, queued status count, worker logs, Postgres saturation, and recent deploy/job changes."
          runbook: "monitoring/README.md#troubleshooting"

  - name: hms-infra
    rules:
      - alert: HMSExporterTargetDown
        expr: up{job!~"hms-api|hms-worker"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: HMS infrastructure exporter is unreachable
          what_happened: "Prometheus cannot scrape one of the host, container, Postgres, or Redis exporters."
          why_it_matters: "The application may still work, but operational visibility is incomplete."
          likely_cause: "The exporter container is down, the WireGuard path is blocked, or the exporter port is not bound to the monitoring interface."
          first_checks: "Use the job and instance labels, then check the exporter container and firewall/WireGuard rules."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSDiskSpaceLow
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs"}
            /
            node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|proc|sysfs|devtmpfs"}
          ) < 0.15
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: HMS VPS disk space is low
          what_happened: "A persistent filesystem has less than 15 percent free space."
          why_it_matters: "Low disk can break Postgres writes, Docker image pulls, backups, Loki storage, and deploys."
          likely_cause: "Docker images/logs, Postgres data, local backups, or Loki/Prometheus retention are consuming disk."
          first_checks: "Check df -h, docker system df, backup directory size, and monitoring volume sizes before deleting anything."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSHostMemoryPressure
        expr: |
          (
            node_memory_MemAvailable_bytes
            /
            node_memory_MemTotal_bytes
          ) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HMS VPS memory pressure is high
          what_happened: "Available host memory has stayed below 10 percent."
          why_it_matters: "The API, worker, Postgres, or Redis may become slow or get killed under memory pressure."
          likely_cause: "Traffic burst, heavy queries, worker load, too little swap, or monitoring storage pressure on a small VPS."
          first_checks: "Check docker stats, top memory containers, Postgres memory, worker concurrency, and swap usage."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSContainerRestarting
        expr: |
          changes(container_start_time_seconds{
            container_label_com_docker_compose_service=~"hms-api|hms-worker|hms-migrator|db|pgbouncer|redis|caddy|frontend"
          }[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HMS container is restarting repeatedly
          what_happened: "A core HMS container has restarted multiple times in the last 15 minutes."
          why_it_matters: "Restart loops can hide deploy failures, dependency failures, memory kills, or configuration errors."
          likely_cause: "Bad env/config, failed healthcheck, OOM kill, dependency outage, or recent deploy regression."
          first_checks: "Use the service label, inspect docker compose ps, then check the last 120 log lines for that service."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSPostgresExporterDown
        expr: up{job="postgres"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: HMS Postgres exporter is down
          what_happened: "Prometheus cannot scrape Postgres exporter metrics."
          why_it_matters: "Database health may be invisible even if the application is still serving traffic."
          likely_cause: "The exporter is down, DB credentials are wrong, Postgres is unavailable, or the internal Docker network is broken."
          first_checks: "Check postgres-exporter logs, db container health, and DATA_SOURCE_NAME credentials."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSRedisExporterDown
        expr: up{job="redis"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: HMS Redis exporter is down
          what_happened: "Prometheus cannot scrape Redis exporter metrics."
          why_it_matters: "Cache and async-job dependency health may be invisible."
          likely_cause: "The exporter is down, Redis is unavailable, or the internal Docker network is broken."
          first_checks: "Check redis-exporter logs, redis container health, and Redis memory usage."
          runbook: "monitoring/README.md#troubleshooting"

      - alert: HMSTempoTargetDown
        expr: up{job=~"tempo|tempo-distributor|tempo-query-frontend|tempo-gateway"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: HMS tracing target is unreachable
          what_happened: "Prometheus cannot scrape one of the configured Tempo tracing targets."
          why_it_matters: "Distributed traces may be missing when debugging slow or failing requests."
          likely_cause: "Tempo is down, the tracing collector is down, the target file is wrong, or the private monitoring network cannot reach the tracing service."
          first_checks: "Check Prometheus targets for the Tempo job, then inspect Tempo or collector logs and confirm the private scrape address from the monitoring host."
          runbook: "monitoring/README.md#troubleshooting"
