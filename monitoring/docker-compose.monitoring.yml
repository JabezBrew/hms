x-monitoring-logging: &monitoring-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.staging.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-6GB}
    volumes:
      - ./prometheus/prometheus.staging.yml:/etc/prometheus/prometheus.staging.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - hms_edge
      - hms_internal
    restart: unless-stopped
    logging: *monitoring-logging

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?set GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  tempo:
    image: grafana/tempo:2.6.1
    command: -config.file=/etc/tempo/tempo-local.yaml
    volumes:
      - ./tempo/tempo-local.yaml:/etc/tempo/tempo-local.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  metrics-proxy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      CLIENT_DOMAIN: ${CLIENT_DOMAIN:?set CLIENT_DOMAIN}
    volumes:
      - ./caddy/metrics-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - hms_edge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *monitoring-logging

  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      LOKI_WRITE_URL: http://loki:3100/loki/api/v1/push
      TEMPO_OTLP_ENDPOINT: tempo:4317
      OBS_CLIENT_SLUG: ${CLIENT_SLUG:-staging}
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:-staging}
      OBS_COMPOSE_PROJECT_REGEX: ${OBS_COMPOSE_PROJECT_REGEX:-.*}
    volumes:
      - ./alloy/docker-logs.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      - loki
      - tempo
    networks:
      - monitoring
      - hms_internal
    restart: unless-stopped
    logging: *monitoring-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        : "$${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID}"
        sed "s/__TELEGRAM_CHAT_ID__/$${TELEGRAM_CHAT_ID}/g" /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID}
    volumes:
      - ./alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - ${TELEGRAM_BOT_TOKEN_FILE:-./alertmanager/secrets/telegram_bot_token}:/run/secrets/telegram_bot_token:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: user=${DB_USER:-hms} password=${DB_PASSWORD:?set DB_PASSWORD} host=db port=5432 dbname=${DB_NAME:-hms} sslmode=disable
    networks:
      - monitoring
      - hms_internal
    restart: unless-stopped
    logging: *monitoring-logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    command:
      - --redis.addr=redis://redis:6379
    networks:
      - monitoring
      - hms_internal
    restart: unless-stopped
    logging: *monitoring-logging

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alloy-data:
  alertmanager-data:

networks:
  monitoring:
    driver: bridge
  hms_edge:
    external: true
    name: ${HMS_EDGE_NETWORK:-hms-client_edge}
  hms_internal:
    external: true
    name: ${HMS_INTERNAL_NETWORK:-hms-client_internal}
