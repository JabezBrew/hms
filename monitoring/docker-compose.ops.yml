x-monitoring-logging: &monitoring-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.ops.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-12GB}
    volumes:
      - ./prometheus/prometheus.ops.yml:/etc/prometheus/prometheus.ops.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/client-targets:/etc/prometheus/client-targets:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?set GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
      - "${OPS_WG_IP:?set OPS_WG_IP}:3100:3100"
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  tempo:
    image: grafana/tempo:2.6.1
    command: -config.file=/etc/tempo/tempo-local.yaml
    volumes:
      - ./tempo/tempo-local.yaml:/etc/tempo/tempo-local.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  alloy:
    image: grafana/alloy:v1.7.5
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      LOKI_WRITE_URL: http://loki:3100/loki/api/v1/push
      TEMPO_OTLP_ENDPOINT: tempo:4317
      OBS_CLIENT_SLUG: ${OBS_CLIENT_SLUG:-ops}
      OBS_ENVIRONMENT: ${OBS_ENVIRONMENT:-ops}
      OBS_COMPOSE_PROJECT_REGEX: ${OBS_COMPOSE_PROJECT_REGEX:-.*}
    volumes:
      - ./alloy/docker-logs.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    ports:
      - "${OPS_WG_IP:?set OPS_WG_IP}:4317:4317"
      - "${OPS_WG_IP:?set OPS_WG_IP}:4318:4318"
    depends_on:
      - loki
      - tempo
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        : "$${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID}"
        sed "s/__TELEGRAM_CHAT_ID__/$${TELEGRAM_CHAT_ID}/g" /etc/alertmanager/alertmanager.yml.template > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID}
    volumes:
      - ./alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - ${TELEGRAM_BOT_TOKEN_FILE:-./alertmanager/secrets/telegram_bot_token}:/run/secrets/telegram_bot_token:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring
    restart: unless-stopped
    logging: *monitoring-logging

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alloy-data:
  alertmanager-data:

networks:
  monitoring:
    driver: bridge
