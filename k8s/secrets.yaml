# Kubernetes Secrets for HMS
# Sensitive configuration values - DO NOT COMMIT WITH REAL VALUES
#
# For production, use:
# - Kubernetes Secrets with external secret management (Vault, AWS Secrets Manager)
# - sealed-secrets for GitOps workflows
# - External Secrets Operator
#
# Create secret from literal values:
#   kubectl create secret generic hms-secrets \
#     --namespace=hms \
#     --from-literal=SECRET_KEY='your-secret-key' \
#     --from-literal=DB_PASSWORD='your-db-password' \
#     ...
#
# Or apply this template after base64 encoding values:
#   echo -n 'your-secret-key' | base64

apiVersion: v1
kind: Secret
metadata:
  name: hms-secrets
  namespace: hms
  labels:
    app.kubernetes.io/name: hms
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholder values before deploying
  # In production, use external secret management instead

  # Django secret key (generate with: python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())")
  SECRET_KEY: "REPLACE_WITH_REAL_SECRET_KEY"

  # Database credentials
  DB_NAME: "hms"
  DB_USER: "hms_user"
  DB_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
  DB_HOST: "postgres.database.svc.cluster.local"

  # Read replica (optional)
  DB_REPLICA_HOST: ""
  DB_REPLICA_USER: ""
  DB_REPLICA_PASSWORD: ""

  # Redis URL
  REDIS_URL: "redis://redis.cache.svc.cluster.local:6379/0"

  # Email (SendGrid)
  SENDGRID_API_KEY: "REPLACE_WITH_SENDGRID_KEY"
  DEFAULT_FROM_EMAIL: "noreply@yourdomain.com"

  # Google Cloud Healthcare API
  GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gcp/service-account.json"
  GOOGLE_CLOUD_PROJECT: "your-gcp-project"
  GOOGLE_HEALTHCARE_DATASET: "your-dataset"
  GOOGLE_FHIR_STORE: "your-fhir-store"
  GOOGLE_DICOM_STORE: "your-dicom-store"
  GOOGLE_HL7V2_STORE: "your-hl7v2-store"
