# Legacy Kubernetes ConfigMap for the old Django HMS deployment.
#
# Active Rust V2 deploys use ops/compose-v2/.env and compose.yml. Keep this
# manifest only for explicit legacy Kubernetes reference work.
#
# Non-sensitive configuration values
#
# Apply: kubectl apply -f k8s/configmap.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: hms-config
  namespace: hms
  labels:
    app.kubernetes.io/name: hms
    app.kubernetes.io/component: config
data:
  # Django settings
  DEBUG: "False"
  DJANGO_SETTINGS_MODULE: "hms_backend.settings"

  # Database settings (host/credentials in secrets)
  DB_PORT: "5432"

  # Application settings
  ALLOWED_HOSTS: "localhost,api.hms.local,*.hms.local"
  CORS_ALLOWED_ORIGINS: "https://hms.local,https://www.hms.local"
  CSRF_TRUSTED_ORIGINS: "https://hms.local,https://www.hms.local"
  MIGRATE_ON_STARTUP: "false"
  FAIL_ON_PENDING_MIGRATIONS: "true"
  RUN_MIGRATIONS_ONLY: "false"

  # Frontend URLs (for email links, etc.)
  FRONTEND_URL: "https://hms.local"

  # Gunicorn settings
  GUNICORN_WORKERS: "4"
  GUNICORN_THREADS: "2"
  GUNICORN_TIMEOUT: "30"

  # Celery settings
  CELERY_CONCURRENCY: "2"
