# Kubernetes Deployment for HMS Celery Workers
# Background task processing
#
# Apply: kubectl apply -f k8s/celery-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms-celery
  namespace: hms
  labels:
    app.kubernetes.io/name: hms
    app.kubernetes.io/component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hms
      app.kubernetes.io/component: celery-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hms
        app.kubernetes.io/component: celery-worker
    spec:
      serviceAccountName: hms-celery
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: celery
          image: ${DOCKER_REGISTRY}/hms-celery:${VERSION}
          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: hms-config
            - secretRef:
                name: hms-secrets

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Celery doesn't have HTTP endpoints, so we check process status
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - hms_backend
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3

      terminationGracePeriodSeconds: 300  # Allow time for tasks to complete

---
# Celery Beat - Single instance scheduler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms-celery-beat
  namespace: hms
  labels:
    app.kubernetes.io/name: hms
    app.kubernetes.io/component: celery-beat
spec:
  replicas: 1  # Only one beat scheduler
  selector:
    matchLabels:
      app.kubernetes.io/name: hms
      app.kubernetes.io/component: celery-beat
  strategy:
    type: Recreate  # Ensure only one beat at a time
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hms
        app.kubernetes.io/component: celery-beat
    spec:
      serviceAccountName: hms-celery
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: celery-beat
          image: ${DOCKER_REGISTRY}/hms-celery:${VERSION}
          imagePullPolicy: Always
          command: ["celery", "-A", "hms_backend", "beat", "--loglevel=info"]

          envFrom:
            - configMapRef:
                name: hms-config
            - secretRef:
                name: hms-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hms-celery
  namespace: hms
  labels:
    app.kubernetes.io/name: hms
    app.kubernetes.io/component: celery
