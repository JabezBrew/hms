# Railway configuration for HMS Backend API
# Using Nixpacks builder (auto-detects Django)

[build]
builder = "nixpacks"

[deploy]
numReplicas = 1
healthcheckPath = "/api/health/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
startCommand = "python manage.py migrate && gunicorn hms_backend.wsgi:application --bind 0.0.0.0:$PORT"
