[pytest]
# Django settings module
DJANGO_SETTINGS_MODULE = hms_backend.settings

# Test file patterns
python_files = tests.py test_*.py *_tests.py

# Test directories
testpaths = apps tests

# Default command line options
addopts =
    --reuse-db
    --no-migrations
    --cov=apps
    --cov-report=html:coverage_html
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=70
    -v
    --tb=short

# Parallel execution (uncomment for CI)
# addopts = -n auto

# Test markers
markers =
    tier1: Critical path tests - auth, nursing, workflows, patients (90%+ coverage target)
    tier2: Core feature tests - appointments, wards, lab, referrals (80%+ coverage target)
    tier3: Enhanced feature tests - billing, inventory, drug_safety (70%+ coverage target)
    critical: Must-pass tests that should never be skipped
    integration: Cross-app integration tests
    rbac: Role-based access control tests
    slow: Tests that take longer than 1 second
    e2e: End-to-end tests (rarely used in backend)
    fhir: Tests related to FHIR integration
    celery: Tests related to Celery tasks

# Coverage configuration
[coverage:run]
branch = True
source = apps
omit =
    */migrations/*
    */tests/*
    */__pycache__/*
    */admin.py
    */apps.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

# Minimum coverage thresholds by app (enforced in CI)
# tier1: apps/users, apps/nursing, apps/workflows, apps/patients, apps/clinical_notes - 90%
# tier2: apps/appointments, apps/wards, apps/laboratory, apps/referrals - 80%
# tier3: apps/billing, apps/inventory, apps/drug_safety, apps/audit - 70%

# Django database configuration for tests
[tool:pytest]
DJANGO_SETTINGS_MODULE = hms_backend.settings

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
