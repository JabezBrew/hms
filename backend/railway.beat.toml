# Railway configuration for HMS Celery beat service.
# Point the Railway service's config-as-code path to `/backend/railway.beat.toml`.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "celery -A hms_backend beat --loglevel=info"
numReplicas = 1
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
